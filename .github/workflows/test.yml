name: workflow
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Source AWS account/region.
        required: true
        type: environment
        default: production

      debug:
        description: Enable debug logging.
        type: boolean
jobs:
  test:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    #env: &env
      #NODE_ENV: ${{ vars.NODE_ENV }}
      #ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG || vars.ACTIONS_STEP_DEBUG }}

    steps:
    - name: Debug context/environment
      if: runner.debug == '1' || vars.ACTIONS_STEP_DEBUG == 'true' || inputs.debug == 'true' #env.ACTIONS_STEP_DEBUG
      run: |
        echo "::debug::${{ toJSON(github) }}"
        echo "::debug::${{ toJSON(vars) }}"
        echo "::debug::${{ toJSON(env) }}"
      #echo "toJSON: ${{ format('[{0}, {1}, {2}]', toJSON(github), toJSON(vars), toJSON(env)) }}"

    - name: Reflect repository environment
      run: jq 'to_entries[] | "\(.key)=\(.value)"' <<< '${{ toJSON(vars) }}' >> $GITHUB_ENV

    - name: NODE_ENV
      run: |
        echo "NODE_ENV: $NODE_ENV"
      #env: *env

    - name: Checkout
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
  
    - name: Install pnpm and Node.js
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1

    - name: Run script
      run: node index.[tj]s
