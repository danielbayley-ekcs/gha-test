name: workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Source AWS account/region.
        required: true
        type: environment
        default: production
      
      debug:
        description: Enable debug logging.
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    env: &env
      NODE_ENV: ${{ vars.NODE_ENV }}

    steps:
    #- run: "ACTIONS_STEP_DEBUG=1" >> $GITHUB_ENV
    
    - name: Debug context/environment
      #if: runner.debug == '1' || vars.ACTIONS_STEP_DEBUG == 'true' || inputs.debug == 'true'
      run: |
        echo "toJSON: ${{ format('{0}\n{1}\n{2}', toJSON(github), toJSON(vars), toJSON(env)) }}"
      #echo "toJSON: ${{ format('[{0}, {1}, {2}]', toJSON(github), toJSON(vars), toJSON(env)) }}"

    - name: NODE_ENV
      run: | # FIXME
        echo "NODE_ENV: ${NODE_ENV:-failed}"
        echo "NODE_ENV: ${{ vars.NODE_ENV || 'vars.NODE_ENV failed' }}"
      #env: *env

    - name: Checkout
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
  
    - name: Install pnpm and Node.js
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1

    - name: Run script
      run: node index.[tj]s
