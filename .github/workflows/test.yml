name: workflow

on:
  workflow_dispatch: &inputs
    inputs:
      environment:
        description: Source AWS account/region.
        required: true
        type: environment
        default: production

  #workflow_call: *inputs

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Debug context/environment
      if: runner.debug == '1' || vars.ACTIONS_STEP_DEBUG == 'true' || inputs.debug == 'true'
      run: echo "::debug::${{ toJSON('[github, vars, env]') }}"

    - name: NODE_ENV
      run: echo "NODE_ENV: $NODE_ENV"
