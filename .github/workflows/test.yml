name: workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Source AWS account/region.
        required: true
        type: environment
        default: production
      
      debug:
        description: Enable debug logging.
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    env: &env
      NODE_ENV: ${{ vars.NODE_ENV }}

    steps:
    - name: Debug context/environment
      #if: runner.debug == '1' || vars.ACTIONS_STEP_DEBUG == 'true' || inputs.debug == 'true'
      run: |
        echo "::debug::Debugging"
        echo "toJSON: ${{ toJSON('[github, vars, env]') }}"

    - name: NODE_ENV
      run: |
        echo "HOME: ${{ vars.ELSE || '$HOME' }}"
        echo "NODE_ENV: ${NODE_ENV:-failed}"
        echo "NODE_ENV: ${{ vars.NODE_ENV || 'vars.NODE_ENV failed' }}"
      #env: *env
