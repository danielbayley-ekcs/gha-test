name: workflow
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Source AWS account/region.
        required: true
        type: environment
        default: production

      debug:
        description: Enable debug logging.
        type: boolean
env:
  ACTIONS_STEP_DEBUG: ${{ secrets.ACTIONS_STEP_DEBUG == 'true' || vars.ACTIONS_STEP_DEBUG == 'true' }}

jobs:
  test:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      deployment: false

    steps:
    - name: Debug context/environment
      if: runner.debug == '1' || env.ACTIONS_STEP_DEBUG == 'true' || inputs.debug
      run: |
        echo '::debug::${{ toJSON(github) }}'
        echo '::debug::${{ toJSON(vars) }}'
        echo '::debug::${{ toJSON(env) }}'
        echo '::debug::${{ toJSON(inputs) }}'

    - name: Reflect repository environment
      run: jq 'to_entries[] | "\(.key)=\(.value)"' --raw-output <<< '${{ toJSON(vars) }}' >> $GITHUB_ENV

    - name: NODE_ENV
      run: |
        echo "NODE_ENV: $NODE_ENV"

    - name: Checkout
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
  
    - name: Install pnpm and Node.js
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1

    - name: Run script
      run: node index.[tj]s
