name: workflow

on:
  workflow_dispatch: &inputs
    inputs:
      environment:
        description: Choose an environment
        required: true
        default: production

  workflow_call: *inputs

jobs:
  test:
    steps:
    - if: runner.debug == '1' || vars.ACTIONS_STEP_DEBUG == 'true' || inputs.debug == 'true'
      run: echo '::debug::${{ toJSON(github, vars, env) }}'

