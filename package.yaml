name: test
private: true
type: module

engines:
  node: &node-version ">=22.18.0"
  pnpm: &pnpm-version ^12
devEngines:
  runtime:
    name: node
    version: *node-version
    onFail: download
  packageManager:
    name: pnpm
    version: *pnpm-version
    onFail: download

devDependencies:
  "@types/node": ^26.6.6
  typescript: ^7.0.2
  yaml: ^2.9.1

scripts:
  prepare: yaml --single --json --indent ${TABSIZE:-2} < package.yaml > package.json
  lint.typecheck: tsc --noEmit
  lint.tc: pnpm lint.typecheck
